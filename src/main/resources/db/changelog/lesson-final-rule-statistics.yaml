databaseChangeLog:
  - changeSet:
      id: create-rule-statistics-table
      author: yurii

      changes:
        - createTable:
            tableName: rule_statistics

            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true

                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: rule_id
                  type: BIGINT

                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: count
                  type: BIGINT
                  defaultValueNumeric: 0

                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: rule_statistics
            baseColumnNames: rule_id
            referencedTableName: dynamic_rule
            referencedColumnNames: id
            constraintName: fk_rule_statistics_dynamic_rule
            onDelete: CASCADE

  - changeSet:
      id: add-statistics-for-existing-rules
      author: yurii

      changes:
        - sql:
            sql: |
              INSERT INTO rule_statistics (rule_id, count)
              SELECT id, 0
              FROM dynamic_rule
              WHERE id NOT IN (
                  SELECT rule_id
                  FROM rule_statistics
              );
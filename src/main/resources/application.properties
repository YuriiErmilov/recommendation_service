spring.application.name=recommendationService
server.port=${SERVER_PORT:8080}

# PostgreSQL ? ???????????? ??????? ? ??????????
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/recommendation_rules}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# H2 ? ???? ?????? ? ??????????????, ?????????? ? ????????????
knowledge.datasource.url=${KNOWLEDGE_DATASOURCE_URL:jdbc:h2:file:C:/database/transaction;ACCESS_MODE_DATA=r;IFEXISTS=TRUE}
knowledge.datasource.username=${KNOWLEDGE_DATASOURCE_USERNAME:}
knowledge.datasource.password=${KNOWLEDGE_DATASOURCE_PASSWORD:}
knowledge.datasource.driver-class-name=org.h2.Driver

# JPA ? Liquibase
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Telegram
telegram.bot.token=${TELEGRAM_BOT_TOKEN}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha